[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-kubernetes-server"
version = "1.0.0"
description = "Enterprise-grade MCP server for Kubernetes operations - works locally and in AWS EKS environments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sthitaprajnas" }]
keywords = ["mcp", "kubernetes", "aws", "eks", "devops", "infrastructure"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    # MCP framework
    "fastmcp>=2.0.0",
    # Kubernetes client
    "kubernetes>=29.0.0",
    # AWS SDK
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    # EKS token generation
    "aws-iam-authenticator-token>=0.1.0",
    # Configuration & validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # YAML handling
    "pyyaml>=6.0.1",
    # Utilities
    "python-dateutil>=2.8.2",
    "rich>=13.7.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "types-pyyaml>=6.0.12",
    "types-python-dateutil>=2.8.19",
]

[project.scripts]
mcp-kubernetes = "mcp_kubernetes.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_kubernetes"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

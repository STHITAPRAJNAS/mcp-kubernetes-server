# =============================================================================
# MCP Kubernetes Server - Kubernetes Deployment
# =============================================================================
# Deployed in the mcp-system namespace for isolation.
# Uses IRSA (IAM Roles for Service Accounts) for AWS authentication.
# =============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: mcp-system
  labels:
    app.kubernetes.io/managed-by: mcp-kubernetes-server

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-kubernetes-server
  namespace: mcp-system
  labels:
    app.kubernetes.io/name: mcp-kubernetes-server
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: mcp-server
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: 2  # HA deployment
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-kubernetes-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Zero-downtime updates
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-kubernetes-server
        app.kubernetes.io/version: "1.0.0"
      annotations:
        # Inject IRSA credentials (done automatically by EKS Pod Identity Webhook)
        # Prometheus scraping
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: mcp-kubernetes-server

      # Security context for the pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: mcp-kubernetes-server
          image: "REGISTRY/mcp-kubernetes-server:1.0.0"
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            # Server configuration
            - name: MCP_K8S_ENV
              value: "aws"
            - name: MCP_K8S_TRANSPORT
              value: "sse"
            - name: MCP_K8S_HOST
              value: "0.0.0.0"
            - name: MCP_K8S_PORT
              value: "8080"
            - name: MCP_K8S_LOG_LEVEL
              value: "INFO"
            - name: MCP_K8S_JSON_LOGS
              value: "true"

            # AWS configuration
            - name: AWS_DEFAULT_REGION
              valueFrom:
                configMapKeyRef:
                  name: mcp-kubernetes-config
                  key: aws_region

            # EKS cluster name
            - name: MCP_K8S_EKS_CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: mcp-kubernetes-config
                  key: eks_cluster_name

            # Security settings
            - name: MCP_K8S_ALLOW_DESTRUCTIVE
              valueFrom:
                configMapKeyRef:
                  name: mcp-kubernetes-config
                  key: allow_destructive
                  optional: true
            - name: MCP_K8S_REQUIRE_DESTRUCTIVE_CONFIRMATION
              value: "true"
            - name: MCP_K8S_PROTECTED_NAMESPACES
              value: "kube-system,kube-public,kube-node-lease"

          # Resource limits - generous for API server responsiveness
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # Container security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Python needs write access
            capabilities:
              drop:
                - ALL

          # Health probes
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

          # Graceful shutdown
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 50Mi

      # Anti-affinity: spread replicas across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: mcp-kubernetes-server
                topologyKey: kubernetes.io/hostname

      # Graceful termination
      terminationGracePeriodSeconds: 30

      # DNS configuration
      dnsPolicy: ClusterFirst

---
apiVersion: v1
kind: Service
metadata:
  name: mcp-kubernetes-server
  namespace: mcp-system
  labels:
    app.kubernetes.io/name: mcp-kubernetes-server
    app.kubernetes.io/component: mcp-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcp-kubernetes-server
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-kubernetes-config
  namespace: mcp-system
  labels:
    app.kubernetes.io/name: mcp-kubernetes-server
data:
  aws_region: "us-east-1"
  eks_cluster_name: "my-eks-cluster"
  allow_destructive: "true"

---
# Horizontal Pod Autoscaler for production scale
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mcp-kubernetes-server
  namespace: mcp-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mcp-kubernetes-server
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# Pod Disruption Budget for rolling updates and node drains
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mcp-kubernetes-server
  namespace: mcp-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-kubernetes-server

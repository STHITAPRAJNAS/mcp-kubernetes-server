# =============================================================================
# ServiceAccount with IRSA annotation for AWS EKS deployment
# =============================================================================
# The IAM role specified here must have EKS API access.
# Replace ACCOUNT_ID, REGION, and CLUSTER_NAME with your values.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-kubernetes-server
  namespace: mcp-system
  labels:
    app.kubernetes.io/name: mcp-kubernetes-server
    app.kubernetes.io/component: mcp-server
  annotations:
    # IRSA: IAM Role for Service Account
    # This role must be configured with the EKS OIDC provider trust policy
    # and have the necessary Kubernetes API access via aws-auth ConfigMap
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/mcp-kubernetes-server-role"
    eks.amazonaws.com/token-expiration: "86400"
